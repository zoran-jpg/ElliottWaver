name: quality

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  quality:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints/runtime.txt
            constraints/dev.txt

      - name: Install xvfb on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk xvfb

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c constraints/dev.txt -e ".[dev]"

      - name: Check formatting
        run: python -m ruff format --check .

      - name: Lint
        run: python -m ruff check .

      - name: Type check
        run: python -m mypy src tests

      - name: Test (Linux headless)
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m pytest

      - name: Test (Windows)
        if: runner.os == 'Windows'
        run: python -m pytest

  wheel-smoke:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints/runtime.txt
            constraints/dev.txt

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c constraints/dev.txt build==1.3.0

      - name: Install tkinter dependency on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk

      - name: Build wheel
        run: python -m build --wheel

      - name: Create smoke venv (Linux)
        if: runner.os == 'Linux'
        run: |
          python -m venv .wheel-smoke-venv
          ./.wheel-smoke-venv/bin/python -m pip install --upgrade pip
          ./.wheel-smoke-venv/bin/python -m pip install -c constraints/runtime.txt dist/*.whl
          ./.wheel-smoke-venv/bin/python -m pip check
          ./.wheel-smoke-venv/bin/python engineering/scripts/wheel_smoke.py

      - name: Create smoke venv (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m venv .wheel-smoke-venv
          .\.wheel-smoke-venv\Scripts\python.exe -m pip install --upgrade pip
          $wheel = Get-ChildItem dist\*.whl | Select-Object -First 1
          .\.wheel-smoke-venv\Scripts\python.exe -m pip install -c constraints/runtime.txt $wheel.FullName
          .\.wheel-smoke-venv\Scripts\python.exe -m pip check
          .\.wheel-smoke-venv\Scripts\python.exe engineering/scripts/wheel_smoke.py
