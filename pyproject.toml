[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "elliottwaver"
version = "0.1.0"
description = "Adaptive Market Decision Intelligence Platform"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }
dependencies = [
  "pydantic>=2.8,<3.0",
  "pydantic-settings>=2.4,<3.0",
  "structlog>=24.4,<26.0",
]

[project.optional-dependencies]
dev = [
  "black>=24.8,<26.0",
  "mypy>=1.11,<2.0",
  "pre-commit>=3.8,<5.0",
  "pytest>=8.3,<9.0",
  "pytest-cov>=5.0,<7.0",
  "ruff>=0.6,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/elliottwaver"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["A", "ANN", "ARG", "ASYNC", "B", "BLE", "C4", "DTZ", "E", "EM", "ERA", "F", "I", "N", "PERF", "PIE", "PL", "PT", "PTH", "RET", "RSE", "RUF", "S", "SIM", "T20", "TC", "TRY", "UP", "W"]
ignore = ["ANN401", "PLR0913"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "ANN201", "PLR2004"]

[tool.ruff.lint.isort]
known-first-party = ["elliottwaver"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
show_error_codes = true
pretty = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["--strict-config", "--strict-markers", "--cov=elliottwaver", "--cov-report=term-missing", "--cov-fail-under=90"]

[tool.coverage.run]
branch = true
source = ["elliottwaver"]
